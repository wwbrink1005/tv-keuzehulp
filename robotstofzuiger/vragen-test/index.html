<!DOCTYPE html>
<html lang="nl">
<head>
 <meta charset="UTF-8">
 <base href="../../">
 <link rel="icon" type="image/svg+xml" href="logo's/logo_favicon.svg">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="robots" content="noindex, nofollow">
 <title>Robotstofzuiger Keuzehulp testversie</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
 <link rel="stylesheet" href="shared/menu.css">
 <link rel="stylesheet" href="shared/footer.css">
 <link rel="stylesheet" href="shared/quiz3d.css">
 <script src="shared/menu.js" defer></script>
 <script src="shared/footer.js" defer></script>
 <style>
/* vloervlakken, route van de robot, stof en accu: allemaal in perspectief op de vloer getekend */
.fx .area { fill: rgba(9,84,163,.16); stroke: #0954a3; stroke-width: 2; stroke-dasharray: 7 6; stroke-linejoin: round; }
.fx .area.soft { fill: rgba(9,84,163,.08); }
.fx .route { fill: none; stroke: #0954a3; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 9 7; animation: march 1.6s linear infinite; }
.fx .route.rand { stroke: #b0661f; }
.fx .mop { fill: none; stroke: rgba(70,160,235,.2); stroke-linejoin: round; stroke-linecap: round; }
.fx .dust { fill: rgba(255,255,255,.9); stroke: rgba(80,70,60,.35); stroke-width: .6; animation: drift 3.2s ease-in-out infinite; }
@keyframes march { to { stroke-dashoffset: -32; } }
@keyframes drift { 0%, 100% { opacity: .15; transform: translateY(0); } 50% { opacity: .95; transform: translateY(-6px); } }
.fx .wave { fill: none; stroke: #0954a3; stroke-width: 2.4; stroke-linecap: round; animation: wave 2.4s ease-in-out infinite; }
.fx .wave.soft { stroke-dasharray: 3 7; }
@keyframes wave { 0%, 100% { opacity: .22; } 50% { opacity: .95; } }
@media (prefers-reduced-motion: reduce) { .fx .wave, .fx .route, .fx .dust { animation: none; } }
/* accu-indicator bij de steelstofzuiger */
.batt { display: inline-flex; align-items: center; gap: 7px; }
.batt i { display: inline-flex; gap: 2px; padding: 2px; border: 1.5px solid #1d1d1f; border-radius: 3px; position: relative; }
.batt i::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: #1d1d1f; border-radius: 0 1px 1px 0; }
.batt s { width: 5px; height: 8px; border-radius: 1px; background: #d7dbe0; }
.batt s.on { background: #1f9d61; }
 </style>
 <link rel="preload" as="image" href="robotstofzuiger/vragen-test/img/woonkamer.webp">
</head>
<body>

<header class="test-head">
  <h1>Robotstofzuiger Keuzehulp</h1>
  <span class="test-badge">Testversie 3D</span>
</header>

<main class="wrap">
  <div class="shell">
    <div class="stage" id="stage">
      <div class="progress"><i id="progress"></i></div>
      <div class="scene" id="scene">
        <img class="room" id="roomA" alt="" decoding="async">
        <img class="room" id="roomB" alt="" decoding="async">
        <svg class="fx" id="fx"></svg>
        <div id="tags"></div>
      </div>
      <div class="caption" id="caption"></div>
      <div class="loading" id="loading">Woonkamer laden…</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <p class="step" id="step"></p>
      <div class="q-body" id="qBody"></div>
    </section>
  </div>

  <p class="below">Dit is een testversie van de vragenpagina met een 3D-visualisatie. De vragen en het advies zijn gelijk aan de
  <a href="robotstofzuiger/vragen/">huidige keuzehulp</a>; alleen de visualisatie is anders.</p>
</main>

<script type="module" src="robotstofzuiger/vragen-test/test.js"></script>
</body>
</html>
