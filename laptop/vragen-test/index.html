 <style>
/* inhoud van het laptopscherm (800 px breed canvas, in perspectief geplaatst) */
.lscreen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #0c0c0e; font-family: 'Inter', sans-serif; color: #1d1d1f; transition: opacity .4s ease; }
.lscreen .view { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
.lscreen .view.is-on { opacity: 1; }
.lscreen .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* bureaublad: abstracte golven in de huiskleuren, klok en een taakbalk met app-iconen */
.lscreen .wall { position: absolute; inset: 0; }
.lscreen .wall svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lscreen .clock { position: absolute; left: 26px; top: 22px; color: #fff; font-size: 46px; font-weight: 300; letter-spacing: -.02em; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
.lscreen .clock small { display: block; font-size: 14px; font-weight: 500; letter-spacing: .01em; margin-top: 6px; opacity: .85; }
.lscreen .dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 9px; padding: 7px 10px; border-radius: 14px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(10px); }
.lscreen .dock i { width: 24px; height: 24px; border-radius: 7px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.lscreen .dock .a1 { background: linear-gradient(135deg, #5ab0ff, #0954a3); }
.lscreen .dock .a2 { background: linear-gradient(135deg, #ffffff, #d9dde3); }
.lscreen .dock .a3 { background: linear-gradient(135deg, #ffcf6b, #f08a24); }
.lscreen .dock .a4 { background: linear-gradient(135deg, #6ee7a8, #1f9d61); }
.lscreen .dock .a5 { background: linear-gradient(135deg, #e0a3ff, #7b3fd1); }
.lscreen .win { position: absolute; inset: 0; background: #fff; }
.lscreen .bar { height: 44px; background: #ececef; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.lscreen .bar b { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lscreen .bar b:nth-child(2) { background: #febc2e; } .lscreen .bar b:nth-child(3) { background: #28c840; }
.lscreen .url { margin-left: 18px; flex: 1; height: 26px; border-radius: 13px; background: #fff; font-size: 14px; color: #6b6b70; display: flex; align-items: center; padding: 0 14px; }
.lscreen .hero { position: absolute; left: 24px; right: 24px; top: 60px; height: 130px; border-radius: 12px; overflow: hidden; }
.lscreen .lines { position: absolute; left: 24px; right: 24px; top: 206px; display: flex; flex-direction: column; gap: 12px; }
.lscreen .lines i { height: 12px; border-radius: 6px; background: #e4e4e8; } .lscreen .lines i:nth-child(1) { width: 60%; height: 20px; background: #1d1d1f; } .lscreen .lines i:nth-child(3) { width: 85%; } .lscreen .lines i:nth-child(4) { width: 70%; }
.lscreen .doc { position: absolute; left: 70px; right: 70px; top: 60px; bottom: 0; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.12); padding: 40px 44px; }
.lscreen .doc h4 { margin: 0 0 18px; font-size: 22px; }
.lscreen .doc i { display: block; height: 10px; border-radius: 5px; background: #dcdce2; margin-bottom: 11px; }
.lscreen .doc i:nth-child(4n) { width: 72%; }
.lscreen .editor { position: absolute; inset: 0; background: #1e1e22; }
.lscreen .editor .tools { position: absolute; left: 0; top: 0; bottom: 0; width: 56px; background: #2a2a30; }
.lscreen .editor .side { position: absolute; right: 0; top: 0; bottom: 0; width: 110px; background: #2a2a30; padding: 24px 18px; display: flex; flex-direction: column; gap: 22px; }
.lscreen .editor .side i { height: 4px; border-radius: 2px; background: #4a4a52; position: relative; } .lscreen .editor .side i::after { content: ""; position: absolute; top: -5px; left: var(--p, 50%); width: 14px; height: 14px; border-radius: 50%; background: #e7e7ea; }
.lscreen .editor .photo { position: absolute; left: 66px; top: 24px; object-fit: cover; width: calc(100% - 196px); height: calc(100% - 48px); }
.lscreen .perf { position: absolute; inset: 0; background: #16161a; color: #f2f2f4; padding: 30px 32px; }
.lscreen .perf h4 { margin: 0 0 24px; font-size: 30px; }
.lscreen .meter { margin-bottom: 26px; font-size: 22px; }
.lscreen .meter span { display: flex; justify-content: space-between; margin-bottom: 8px; color: #b7b7bd; }
.lscreen .meter span b { color: #fff; }
.lscreen .meter i { display: block; height: 22px; border-radius: 8px; background: #2c2c33; overflow: hidden; }
.lscreen .meter i em { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2e8b57, #d08a16 70%, #c4452d); background-size: 400px 100%; transition: width .7s var(--ease); }
.lscreen .store { position: absolute; inset: 0; background: #f5f5f7; padding: 28px 32px; }
.lscreen .store h4 { margin: 0 0 6px; font-size: 34px; }
.lscreen .store p { margin: 0 0 22px; color: #6b6b70; font-size: 18px; line-height: 1.35; }
.lscreen .store .sbar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; background: #e2e2e7; margin-bottom: 18px; }
.lscreen .store .sbar em { display: block; height: 100%; transition: width .7s var(--ease); }
.lscreen .store .legend { display: flex; gap: 16px; font-size: 16px; color: #515154; }
.lscreen .store .legend b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
 </style>
 <link rel="preload" as="image" href="laptop/vragen-test/img/bureau.webp">
</head>
<body>

<header class="test-head">
  <h1>Laptop Keuzehulp</h1>
  <span class="test-badge">Testversie 3D</span>
</header>

<main class="wrap">
  <div class="shell">
    <div class="stage" id="stage">
      <div class="progress"><i id="progress"></i></div>
      <div class="scene" id="scene">
        <img class="room" id="roomA" alt="" decoding="async">
        <img class="room" id="roomB" alt="" decoding="async">
        <svg class="fx" id="fx"></svg>
        <div id="tags"></div>
      </div>
      <div class="caption" id="caption"></div>
      <div class="loading" id="loading">Werkplek laden…</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <p class="step" id="step"></p>
      <div class="q-body" id="qBody"></div>
    </section>
  </div>

  <p class="below">Dit is een testversie van de vragenpagina met een 3D-visualisatie. De vragen en het advies zijn gelijk aan de
  <a href="laptop/vragen/">huidige keuzehulp</a>; alleen de visualisatie is anders.</p>
</main>

<script type="module" src="laptop/vragen-test/test.js"></script>
</body>
</html>
