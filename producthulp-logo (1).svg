<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 52" width="340" height="52" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Magnifying glass icon, vertically centered at y=26 -->
  <!-- Lens circle: center (22,22), radius 14 -->
  <circle cx="22" cy="21" r="13" stroke="#0954a3" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Checkmark inside lens, centered ~(22,21) -->
  <polyline
    points="16,21 20.5,25.5 28,16.5"
    stroke="#0954a3"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Handle: from bottom-right of circle outward at 45deg -->
  <line
    x1="31.2" y1="30.2"
    x2="40.5" y2="39.5"
    stroke="#0954a3"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- "producthulp.nl" as one text element -->
  <text
    x="54"
    y="32"
    font-family="'Space Grotesk', 'DM Sans', 'Outfit', sans-serif"
    font-size="22"
    font-weight="700"
    fill="#0a0a1a"
    letter-spacing="-0.3"
  >producthulp.nl</text>
</svg>
