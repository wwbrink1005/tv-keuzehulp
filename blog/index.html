      const FALLBACK_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22%3E%3Crect width=%22400%22 height=%22300%22 fill=%22%23f5f5f7%22/%3E%3Cg transform=%22translate(183,133)%22%3E%3Cpath d=%22m17 2-5 5-5-5%22 fill=%22none%22 stroke=%22%2364748b%22 stroke-width=%221.5%22/%3E%3Crect width=%2220%22 height=%2215%22 x=%222%22 y=%227%22 rx=%222%22 fill=%22none%22 stroke=%22%2364748b%22 stroke-width=%221.5%22/%3E%3C/g%3E%3C/svg%3E";

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      function renderCard(article) {
        return `
          <a class="blog-card" href="${article.url}">
            <div class="blog-card-img">
              <img src="${article.image}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'" />
            </div>
            <div class="blog-card-body">
              <span class="blog-card-tag">${escapeHtml(article.categoryLabel)}</span>
              <h3>${escapeHtml(article.title)}</h3>
              <p>${escapeHtml(article.excerpt)}</p>
              <span class="blog-card-link">Lees meer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
            </div>
          </a>
        `;
      }

      function init() {
        const grid = document.getElementById("blogGrid");
        const empty = document.getElementById("blogEmpty");
        const status = document.getElementById("blogResultsStatus");
        const searchInput = document.getElementById("blogSearchInput");
        const filterChips = Array.from(document.querySelectorAll(".blog-filter-chip"));

        let activeCategory = "alle";

        function applyFilters() {
          const query = searchInput.value.trim().toLowerCase();
          const results = BLOG_ARTICLES.filter((article) => {
            const matchesCategory = activeCategory === "alle" || article.category === activeCategory;
            const matchesQuery =
              !query ||
              article.title.toLowerCase().includes(query) ||
              article.excerpt.toLowerCase().includes(query) ||
              article.categoryLabel.toLowerCase().includes(query) ||
              article.category.toLowerCase().includes(query);
            return matchesCategory && matchesQuery;
          });

          grid.innerHTML = results.map(renderCard).join("");
          empty.classList.toggle("is-visible", results.length === 0);
          status.textContent = results.length === 1
            ? "1 artikel gevonden"
            : `${results.length} artikelen gevonden`;
        }

        filterChips.forEach((chip) => {
          chip.addEventListener("click", () => {
            filterChips.forEach((c) => {
              c.classList.remove("is-active");
              c.setAttribute("aria-selected", "false");
            });
            chip.classList.add("is-active");
            chip.setAttribute("aria-selected", "true");
            activeCategory = chip.dataset.category;
            applyFilters();
          });
        });

        searchInput.addEventListener("input", applyFilters);

        applyFilters();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    </script>
