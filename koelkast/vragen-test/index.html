<!DOCTYPE html>
<html lang="nl">
<head>
 <meta charset="UTF-8">
 <base href="../../">
 <link rel="icon" type="image/svg+xml" href="logo's/logo_favicon.svg">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="robots" content="noindex, nofollow">
 <title>Koelkast Keuzehulp testversie</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
 <link rel="stylesheet" href="shared/menu.css">
 <link rel="stylesheet" href="shared/footer.css">
 <link rel="stylesheet" href="shared/quiz3d.css">
 <script src="shared/menu.js" defer></script>
 <script src="shared/footer.js" defer></script>
 <link rel="preload" as="image" href="koelkast/vragen-test/img/standaard-dicht.webp">
</head>
<body>

<header class="test-head">
  <h1>Koelkast Keuzehulp</h1>
  <span class="test-badge">Testversie 3D</span>
</header>

<main class="wrap">
  <div class="shell">
    <div class="stage" id="stage">
      <div class="progress"><i id="progress"></i></div>
      <div class="scene" id="scene">
        <img class="room" id="roomA" alt="" decoding="async">
        <img class="room" id="roomB" alt="" decoding="async">
        <svg class="fx" id="fx"></svg>
        <div id="tags"></div>
      </div>
      <div class="caption" id="caption"></div>
      <div class="loading" id="loading">Keuken laden…</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <p class="step" id="step"></p>
      <div class="q-body" id="qBody"></div>
    </section>
  </div>

  <p class="below">Dit is een testversie van de vragenpagina met een 3D-visualisatie. De vragen en het advies zijn gelijk aan de
  <a href="koelkast/vragen/">huidige keuzehulp</a>; alleen de visualisatie is anders.</p>
</main>

<script type="module" src="koelkast/vragen-test/test.js"></script>
</body>
</html>
