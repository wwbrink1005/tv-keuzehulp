<!DOCTYPE html>
<html lang="nl">
<head>
 <meta charset="UTF-8">
 <base href="../../">
 <link rel="icon" type="image/svg+xml" href="logo's/logo_favicon.svg">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="robots" content="noindex, nofollow">
 <title>Beamer Keuzehulp testversie</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
 <link rel="stylesheet" href="shared/menu.css">
 <link rel="stylesheet" href="shared/footer.css">
 <link rel="stylesheet" href="shared/quiz3d.css">
 <script src="shared/menu.js" defer></script>
 <script src="shared/footer.js" defer></script>
 <style>
/* projectiescherm met beeld, en de lichtbundel van de beamer */
.pscreen { position: absolute; background: #eeede9; box-shadow: 0 0 0 2px #1a1a1a, 0 10px 30px rgba(0,0,0,.18); border-radius: 2px; overflow: hidden; transition: all var(--dur) var(--ease); }
.pscreen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .8s ease, filter .8s ease; }
.pscreen .slide { position: absolute; inset: 0; background: #fbfbfa; color: #1d1d1f; padding: 7% 8%; font-family: 'Inter', sans-serif; font-size: calc(var(--sw, 600) * 0.022px); transition: opacity .8s ease, filter .8s ease; }
.pscreen .slide b { display: block; font-size: 1.9em; margin-bottom: .2em; }
.pscreen .slide span { color: #6b6b70; }
.pscreen .slide .bars { position: absolute; left: 8%; right: 45%; bottom: 12%; height: 45%; display: flex; align-items: flex-end; gap: 6%; }
.pscreen .slide .bars i { flex: 1; background: #0954a3; border-radius: .2em .2em 0 0; }
.pscreen .slide .bars i:nth-child(2n) { background: #c49a78; }
.pscreen .slide .kpi { position: absolute; right: 8%; bottom: 14%; text-align: right; }
.pscreen .slide .kpi b { font-size: 3em; color: #0954a3; margin: 0; }
.beam-glow { position: absolute; background-size: cover; background-position: center; filter: blur(40px) saturate(1.4); mix-blend-mode: screen; pointer-events: none; transition: opacity .9s ease; }
 </style>
 <link rel="preload" as="image" href="beamer/vragen-test/img/avond.webp">
</head>
<body>

<header class="test-head">
  <h1>Beamer Keuzehulp</h1>
  <span class="test-badge">Testversie 3D</span>
</header>

<main class="wrap">
  <div class="shell">
    <div class="stage" id="stage">
      <div class="progress"><i id="progress"></i></div>
      <div class="scene" id="scene">
        <img class="room" id="roomA" alt="" decoding="async">
        <img class="room" id="roomB" alt="" decoding="async">
        <svg class="fx" id="fx"></svg>
        <div id="tags"></div>
      </div>
      <div class="caption" id="caption"></div>
      <div class="loading" id="loading">Woonkamer laden…</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <p class="step" id="step"></p>
      <div class="q-body" id="qBody"></div>
    </section>
  </div>

  <p class="below">Dit is een testversie van de vragenpagina met een 3D-visualisatie. De vragen en het advies zijn gelijk aan de
  <a href="beamer/vragen/">huidige keuzehulp</a>; alleen de visualisatie is anders.</p>
</main>

<script type="module" src="beamer/vragen-test/test.js"></script>
</body>
</html>
